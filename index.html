<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Don't leak a cross-site Referer: HuggingFace hotlink-protects model files
         (returns 404 when a third-party Referer is present), which broke the
         Cleanup view's in-browser AI background removal on the deployed origin. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-FOUC: apply the saved theme (or the OS preference for `system`)
         synchronously, before the bundle paints, so there's no flash of the
         wrong theme. Mirrors src/theme.ts; key must stay in sync with
         THEME_STORAGE_KEY. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('logolab-theme');
          var dark =
            mode === 'dark' ||
            ((mode === 'system' || !mode) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="LogoLab — drop in a logo, preview it in real-world contexts, vectorize to clean SVG, and export PWA-ready icons."
    />
    <title>LogoLab — preview & export your logo</title>

    <!-- Open Graph / Twitter Card — link-preview cards when shared on
         HN, Reddit, X, Bluesky, Discord, Slack, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://logolab.fabraham.dev/" />
    <meta property="og:site_name" content="LogoLab" />
    <meta
      property="og:title"
      content="LogoLab — preview, clean up & vectorize your logo"
    />
    <meta
      property="og:description"
      content="Preview a logo in real contexts, remove the background, vectorize to SVG, and export PWA icons. No uploads, no sign-up."
    />
    <meta property="og:image" content="https://logolab.fabraham.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="LogoLab — preview, clean up & vectorize your logo"
    />
    <meta
      name="twitter:description"
      content="Preview a logo in real contexts, remove the background, vectorize to SVG, export favicons & PWA icons. Free, runs entirely in your browser."
    />
    <meta name="twitter:image" content="https://logolab.fabraham.dev/og.png" />
    <link rel="canonical" href="https://logolab.fabraham.dev/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
