# Publish the `logolab` package to npm, from a tag.
#
# Deliberately tag-triggered rather than push-to-main: an npm version is
# permanent, so a release has to be an explicit act. Pushing v0.1.1 publishes
# 0.1.1; merging to main does nothing here.
#
# There is no NPM_TOKEN. This uses npm TRUSTED PUBLISHING — npm is configured to
# trust this repository and this workflow file, and authenticates over OIDC with
# a credential that lives for the length of one job. That is also what makes
# --provenance meaningful: the attestation is signed by the same identity, so
# the tarball on npm is cryptographically tied back to this run and this commit.
#
# One-time setup on npmjs.com (Package → Settings → Trusted publisher):
#   organization/user: Blaxzter   repository: LogoLab
#   workflow filename: release.yml
#
# Optional, to reject a tag that isn't yours — set these as repository VARIABLES
# (Settings → Secrets and variables → Actions → Variables):
#   RELEASE_SIGNER_EMAIL  e.g. mail@fabraham.dev
#   RELEASE_SIGNING_KEY   the one-line contents of your signing .pub
# Leave them unset and the check is skipped.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # fetch-depth: 0 so the annotated tag object (and its signature) is here,
      # not just the commit it points at.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the tag is signed by a trusted key
        if: vars.RELEASE_SIGNING_KEY != ''
        run: |
          printf '%s %s\n' \
            "${{ vars.RELEASE_SIGNER_EMAIL }}" \
            "${{ vars.RELEASE_SIGNING_KEY }}" > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships something recent
      # enough today, but pinning the floor here means a Node bump can't quietly
      # take OIDC away and send you hunting for a token that does not exist.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest publishes the wrong version under
      # the right name, and you cannot take it back — so fail before npm is
      # touched at all.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/mcp/package.json').version")
          echo "tag=$tag  package.json=$pkg"
          test "$tag" = "$pkg"

      - run: pnpm typecheck
      - run: pnpm test

      # prepublishOnly rebuilds dist/ from src/, so what ships is compiled here,
      # in this job, from this commit — never a stale local build.
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/mcp
