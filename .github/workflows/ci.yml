# Typecheck + the full suite, on every PR and every push to main.
#
# This is the one that has to exist before the other two mean anything: the
# deploy and release workflows below build from main and from tags, and neither
# is worth much if nothing has run the tests. test/mcp-package.test.ts in
# particular only protects the published package if something executes it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # The gallery A/B lane needs `pnpm fetch:logos`, which downloads brand art
      # that is deliberately not redistributed. CI never runs it: that lane is
      # simply empty here and the rest of the suite is unaffected.
      - run: pnpm test

      # `pnpm build` is `gen-previews && tsc -b && vite build`, so it is both the
      # fourth check and the regeneration of controlPreviews.generated.ts — which
      # is COMMITTED as well, because the dialog imports it and a fresh checkout
      # has to typecheck. That pair is the drift: a tracer change silently makes
      # the committed previews show something the tracer no longer produces, and
      # nothing noticed until someone opened the dialog. So build, then read the
      # diff. The generator deliberately never fails the build (previews are not
      # worth a red deploy); here the empty diff is the assertion instead.
      - run: pnpm build

      - name: Control previews match what the tracer produces
        run: git diff --exit-code -- src/components/vectorize/controlPreviews.generated.ts
