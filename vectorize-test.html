<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogoLab · Vectorize comparison harness</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        background: #f4f4f6;
        color: #1a1a22;
      }
      header { padding: 16px 20px; border-bottom: 1px solid #e2e2e8; background: #fff; }
      header h1 { margin: 0 0 4px; font-size: 15px; }
      header p { margin: 0; color: #6a6a76; }
      .row { padding: 16px 20px; border-bottom: 1px solid #e8e8ee; }
      .row h2 { margin: 0 0 10px; font-size: 14px; }
      .cells { display: flex; gap: 14px; flex-wrap: wrap; }
      .cell { width: 240px; }
      .cell .label {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 6px; font-size: 11px; color: #6a6a76;
      }
      .cell .label b { color: #1a1a22; font-weight: 600; }
      .box {
        width: 240px; height: 240px; border: 1px solid #d8d8e0; border-radius: 8px;
        overflow: hidden; background-color: #fff;
        background-image:
          linear-gradient(45deg, #eee 25%, transparent 25%),
          linear-gradient(-45deg, #eee 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #eee 75%),
          linear-gradient(-45deg, transparent 75%, #eee 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      }
      .box svg, .box img { width: 100%; height: 100%; display: block; }
      .stats { margin-top: 6px; font: 10px/1.3 ui-monospace, monospace; color: #6a6a76; }
      .stats .grad { color: #7a3fd0; font-weight: 600; }
      #status { padding: 10px 20px; color: #6a6a76; }
      #board { padding: 12px 20px; overflow-x: auto; }
      #board table { border-collapse: collapse; font: 11px/1.4 ui-monospace, monospace; }
      #board th, #board td { border: 1px solid #e2e2e8; padding: 3px 8px; text-align: right; }
      #board th:first-child, #board td:first-child,
      #board th:nth-child(2), #board td:nth-child(2) { text-align: left; }
      #board td.pass { color: #1a7f37; }
      #board td.fail { color: #c0392b; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Vectorize evaluation harness</h1>
      <p>Scoreboard (plan §5): L1 CIELAB · SSIM · P95 ΔE · seam · counts · runtime · determinism — potrace &amp; crisp</p>
    </header>
    <div id="status">Running…</div>
    <section id="board"></section>
    <main id="out"></main>
    <script type="module" src="/src/devtest/vectorizeTest.ts"></script>
  </body>
</html>
